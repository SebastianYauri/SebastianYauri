<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Hi, I'm Sebastian. Developer from Peru.">
<style>
  .t { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
  .m { font-family: 'JetBrains Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace; }
  .bob { animation: bob 1.6s ease-in-out infinite; transform-origin: 0 0; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
  .wave { animation: wave 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 50%; }
  @keyframes wave { 0%,100% { transform: rotate(0deg) } 25% { transform: rotate(-28deg) } 75% { transform: rotate(-8deg) } }
  .blink { animation: blink 4s infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(0.1) } }
  .shadow { animation: shadow 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .45 } 50% { transform: scaleX(.8); opacity: .25 } }
  .tw { animation: tw 3s ease-in-out infinite; opacity: 0; }
  @keyframes tw { 0%,100% { opacity: 0; transform: translateY(0) } 40%,60% { opacity: .9 } 100% { transform: translateY(18px) } }
  .cur { animation: cur 1s steps(1) infinite; }
  @keyframes cur { 50% { opacity: 0 } }
  .type { animation: type 3.2s steps(40) 0.4s both; }
  @keyframes type { from { width: 0 } to { width: 500px } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1b1715"/><stop offset="1" stop-color="#2d1d38"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
    <stop offset="0" stop-color="#d97757" stop-opacity=".28"/><stop offset="1" stop-color="#d97757" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".07"/>
  </pattern>
  <clipPath id="typeclip"><rect class="type" x="64" y="196" height="40"/></clipPath>
  <clipPath id="card"><rect width="1200" height="300" rx="22"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
