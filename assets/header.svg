    <g fill="#d97757" class="wave"><rect x="144" y="36" width="24" height="12.5"/><rect x="144" y="48" width="24" height="12.5"/></g>
    <g fill="#b35c42"><rect x="36" y="84" width="12" height="12.5"/><rect x="60" y="84" width="12" height="12.5"/><rect x="96" y="84" width="12" height="12.5"/><rect x="120" y="84" width="12" height="12.5"/><rect x="36" y="96" width="12" height="12.5"/><rect x="60" y="96" width="12" height="12.5"/><rect x="96" y="96" width="12" height="12.5"/><rect x="120" y="96" width="12" height="12.5"/></g>
    <g fill="#1a1412" class="blink"><rect x="48" y="24" width="12" height="12.5"/><rect x="108" y="24" width="12" height="12.5"/><rect x="48" y="36" width="12" height="12.5"/><rect x="108" y="36" width="12" height="12.5"/></g>
  </g>
</g>
</svg>