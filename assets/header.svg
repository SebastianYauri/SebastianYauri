n:3.91s"/><rect class="tw" x="918" y="154" width="6" height="6" fill="#f2d959" style="animation-delay:2.07s;animation-duration:3.96s"/><rect class="tw" x="941" y="204" width="6" height="6" fill="#80d980" style="animation-delay:2.69s;animation-duration:2.88s"/><rect class="tw" x="1152" y="217" width="10" height="10" fill="#f26666" style="animation-delay:2.6s;animation-duration:3.43s"/><rect class="tw" x="1139" y="158" width="8" height="8" fill="#f2d959" style="animation-delay:1.9s;animation-duration:3.49s"/><rect class="tw" x="1067" y="152" width="10" height="10" fill="#80d980" style="animation-delay:0.91s;animation-duration:2.81s"/><rect class="tw" x="942" y="30" width="8" height="8" fill="#f26666" style="animation-delay:1.85s;animation-duration:3.34s"/>
</g>
<text class="t" x="62" y="112" font-size="56" font-weight="800" fill="#f5eee4">Hi, I'm <tspan fill="#d97757">Sebastian</tspan></text>
<text class="t" x="64" y="160" font-size="24" fill="#cfc6bb">Developer from Peru · Python · JavaScript · AI tooling</text>
<g clip-path="url(#typeclip)">
  <text class="m" x="64" y="224" font-size="20" fill="#80d980">&gt; building things that make work easier</text>
</g>
<ellipse class="shadow" cx="885" cy="262" rx="80" ry="9" fill="#000"/>
<g transform="translate(801 112)" shape-rendering="crispEdges">
  <g class="bob">
    <g fill="#d97757"><rect x="24" y="0" width="120" height="12.5"/><rect x="24" y="12" width="120" height="12.5"/><rect x="24" y="24" width="120" height="12.5"/><rect x="24" y="36" width="120" height="12.5"/><rect x="24" y="48" width="120" height="12.5"/><rect x="24" y="60" width="120" height="12.5"/><rect x="24" y="72" width="120" height="12.5"/></g>
